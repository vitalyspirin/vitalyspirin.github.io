<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <!-- Roasted amber-orange rib bone gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97C44" />
      <stop offset="55%" stop-color="#C86A36" />
      <stop offset="100%" stop-color="#A85124" />
    </linearGradient>

    <!-- Rich mahogany-red seared meat base -->
    <linearGradient id="meatBaseGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6B2017" />
      <stop offset="55%" stop-color="#58160E" />
      <stop offset="100%" stop-color="#3E0D08" />
    </linearGradient>

    <!-- Glossy warm reddish-brown top surface highlight -->
    <linearGradient id="meatTopSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B281E" />
      <stop offset="100%" stop-color="#5E1911" />
    </linearGradient>
  </defs>

  <!-- ================= 1. PROTRUDING ROASTED RIB BONE (TOP LEFT) ================= -->
  <g>
    <!-- Main Bone Shaft -->
    <path d="M 244 82 
             C 192 48, 134 22, 74 10 
             C 56 6, 44 12, 32 28 
             C 22 40, 22 48, 36 52 
             C 96 64, 156 88, 218 122 Z" fill="url(#boneGrad)" />

    <!-- Darker Underside Shadow on Bone -->
    <path d="M 28 38 
             C 24 46, 28 50, 42 53 
             C 100 66, 158 90, 218 122 
             L 222 114 
             C 162 80, 102 54, 42 38 
             C 34 36, 30 36, 28 38 Z" fill="#9E4B20" />

    <!-- Lighter Amber Highlight Streaks Along Top of Bone -->
    <path d="M 56 22 
             C 104 32, 152 52, 196 76 
             C 202 80, 200 88, 192 88 
             C 146 66, 98 46, 52 30 
             C 48 28, 50 21, 56 22 Z" fill="#E28A54" opacity="0.7" />
    <path d="M 88 46 C 122 60, 156 76, 184 94 C 176 98, 162 96, 150 90 C 126 78, 102 64, 88 46 Z" fill="#E69562" opacity="0.45" />
  </g>

  <!-- ================= 2. THICK SEARED STEAK / CHOP BODY ================= -->
  <g>
    <!-- Deep Dark Side Crust & Base Silhouette -->
    <path d="M 218 112 
             C 216 102, 224 92, 240 82 
             C 264 66, 294 60, 324 68 
             C 356 76, 384 92, 412 108 
             C 434 118, 466 118, 498 122 
             C 526 126, 546 144, 550 176 
             C 556 222, 540 278, 514 326 
             C 498 354, 486 372, 468 378 
             C 442 386, 410 388, 382 390 
             C 368 390, 358 384, 348 376 
             C 336 366, 322 362, 314 352 
             C 308 344, 310 330, 304 320 
             C 298 310, 286 302, 282 288 
             C 276 268, 282 246, 272 228 
             C 262 212, 242 204, 232 188 
             C 222 172, 222 146, 218 112 Z" fill="url(#meatBaseGrad)" />

    <!-- Elevated Top Seared Surface Plane -->
    <path d="M 234 94 
             C 258 72, 292 64, 326 72 
             C 358 80, 386 96, 414 110 
             C 438 120, 470 120, 498 124 
             C 522 128, 536 144, 538 172 
             C 540 214, 524 268, 496 312 
             C 482 334, 468 348, 446 352 
             C 422 356, 396 356, 374 354 
             C 358 352, 348 338, 344 320 
             C 340 298, 342 272, 330 252 
             C 318 232, 296 220, 284 198 
             C 274 180, 276 158, 264 142 
             C 252 126, 224 118, 234 94 Z" fill="url(#meatTopSurface)" />

    <!-- ================= 3. CHARRED DIAGONAL GRILL MARKS ================= -->
    <g fill="#2C0805">
      <!-- Grill Mark 1 (Top-Left Short) -->
      <path d="M 300 76 
               C 304 76, 306 80, 302 86 
               C 288 104, 274 122, 260 134 
               C 255 138, 251 134, 255 128 
               C 268 110, 282 92, 300 76 Z" />

      <!-- Grill Mark 2 -->
      <path d="M 352 92 
               C 357 92, 358 97, 353 104 
               C 332 132, 310 162, 292 186 
               C 287 192, 282 188, 286 180 
               C 304 152, 326 122, 352 92 Z" />

      <!-- Grill Mark 3 (Center) -->
      <path d="M 412 116 
               C 417 116, 418 122, 413 130 
               C 384 172, 354 218, 332 256 
               C 327 264, 322 260, 326 250 
               C 348 208, 378 162, 412 116 Z" />

      <!-- Grill Mark 4 (Longest) -->
      <path d="M 476 128 
               C 481 128, 482 135, 476 144 
               C 438 202, 398 266, 368 320 
               C 363 328, 358 324, 362 314 
               C 392 256, 432 192, 476 128 Z" />

      <!-- Grill Mark 5 (Bottom-Right) -->
      <path d="M 526 172 
               C 531 172, 532 179, 526 188 
               C 496 238, 464 292, 438 336 
               C 433 344, 428 340, 432 330 
               C 458 282, 490 228, 526 172 Z" />
    </g>

    <!-- ================= 4. GLOSSY SEARED HIGHLIGHTS & RIM REFLECTIONS ================= -->
    <!-- Soft Warm Red-Brown Blisters Between Grill Marks -->
    <g fill="#8B372B" opacity="0.65">
      <path d="M 272 78 C 282 72, 294 72, 294 78 C 286 84, 276 92, 268 96 C 264 90, 266 82, 272 78 Z" />
      <path d="M 314 86 C 324 80, 336 82, 336 90 C 326 98, 314 108, 304 114 C 300 106, 304 94, 314 86 Z" />
      <path d="M 368 112 C 380 106, 396 110, 396 122 C 382 134, 366 152, 354 166 C 348 156, 354 126, 368 112 Z" />
      <path d="M 434 134 C 446 128, 462 132, 462 146 C 446 164, 428 188, 414 206 C 408 194, 418 150, 434 134 Z" />
      <path d="M 508 148 C 518 144, 530 150, 528 164 C 518 180, 506 198, 494 212 C 488 202, 496 162, 508 148 Z" />
      <path d="M 402 276 C 414 260, 428 242, 438 232 C 434 252, 420 276, 404 294 C 398 292, 398 284, 402 276 Z" />
    </g>

    <!-- Crisp Bright Highlight Specs Inside Top Blisters -->
    <g fill="#A64B3E" opacity="0.6">
      <ellipse cx="322" cy="92" rx="10" ry="4.5" transform="rotate(-32 322 92)" />
      <ellipse cx="378" cy="122" rx="14" ry="6" transform="rotate(-36 378 122)" />
      <ellipse cx="444" cy="146" rx="15" ry="6.5" transform="rotate(-38 444 146)" />
      <ellipse cx="516" cy="158" rx="11" ry="5" transform="rotate(-34 516 158)" />
    </g>

    <!-- Side Crust Warm Patches & Specular Rim Lines -->
    <g fill="#75261C" opacity="0.75">
      <path d="M 226 138 C 242 146, 256 158, 266 174 C 260 184, 248 186, 238 176 C 230 166, 226 152, 226 138 Z" />
      <path d="M 288 234 C 304 246, 316 264, 320 284 C 312 294, 298 294, 292 280 C 286 266, 286 248, 288 234 Z" />
      <path d="M 314 326 C 326 322, 338 324, 348 334 C 344 344, 332 348, 320 344 C 312 340, 310 332, 314 326 Z" />
    </g>

    <!-- Thin Glossy Edge Highlights Along Left Ridge -->
    <g fill="none" stroke="#B55B4E" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M 228 124 C 236 136, 248 144, 258 154" />
      <path d="M 274 176 C 282 194, 294 210, 308 224" />
      <path d="M 342 316 C 346 334, 354 348, 372 350" />
    </g>

    <!-- Subtle Dark Bottom-Right Crust Creases -->
    <g fill="none" stroke="#260604" stroke-width="2.5" stroke-linecap="round">
      <path d="M 386 382 C 396 376, 404 370, 412 362" />
      <path d="M 442 376 C 454 368, 464 358, 474 346" />
      <path d="M 484 352 C 504 322, 522 286, 534 250" />
    </g>
  </g>
</svg>