<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Pale, lean turkey meat -->
    <linearGradient id="turkeyMeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d2c4" />
      <stop offset="45%" stop-color="#eebbaa" />
      <stop offset="100%" stop-color="#e2a493" />
    </linearGradient>

    <!-- Gentle golden cooked surface (not dark rind) -->
    <linearGradient id="cookedSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d99a5c" />
      <stop offset="55%" stop-color="#c98544" />
      <stop offset="100%" stop-color="#b06e33" />
    </linearGradient>

    <!-- Thin, even fat streaks -->
    <linearGradient id="fatStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4ec" />
      <stop offset="50%" stop-color="#f8e6d8" />
      <stop offset="100%" stop-color="#fdf4ec" />
    </linearGradient>

    <!-- Soft sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Browning blotch gradient -->
    <radialGradient id="brownBlotch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b87a3e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#b87a3e" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#5a3a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- WHITE background -->
  <rect width="600" height="400" fill="#ffffff" />

  <!-- ===== STRIP 1 (back, offset) ===== -->
  <g transform="translate(-4, 12)" opacity="0.93" filter="url(#softShadow)">
    <rect x="70" y="188" width="490" height="58" rx="10" fill="url(#cookedSurface)" />
    <rect x="78" y="194" width="474" height="46" rx="8" fill="url(#turkeyMeat)" />
    <path d="M 90 206 C 180 202, 300 210, 420 206 C 480 204, 530 208, 548 206"
      fill="none" stroke="url(#fatStreak)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 90 226 C 180 222, 300 230, 420 226 C 480 224, 530 228, 548 226"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="200" cy="212" rx="34" ry="10" fill="url(#brownBlotch)" />
    <ellipse cx="400" cy="222" rx="40" ry="11" fill="url(#brownBlotch)" />
  </g>

  <!-- ===== STRIP 2 (center) ===== -->
  <g filter="url(#softShadow)">
    <rect x="60" y="128" width="500" height="62" rx="12" fill="url(#cookedSurface)" />
    <rect x="68" y="134" width="484" height="50" rx="9" fill="url(#turkeyMeat)" />

    <path d="M 82 148 C 180 144, 300 152, 420 148 C 480 146, 530 150, 544 148"
      fill="none" stroke="url(#fatStreak)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 82 164 C 180 160, 300 168, 420 164 C 480 162, 530 166, 544 164"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 82 176 C 180 173, 300 179, 420 176 C 480 174, 530 177, 544 176"
      fill="none" stroke="url(#fatStreak)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <ellipse cx="150" cy="150" rx="46" ry="12" fill="url(#brownBlotch)" />
    <ellipse cx="300" cy="160" rx="54" ry="13" fill="url(#brownBlotch)" />
    <ellipse cx="450" cy="150" rx="44" ry="12" fill="url(#brownBlotch)" />
    <ellipse cx="500" cy="170" rx="30" ry="9" fill="url(#brownBlotch)" />

    <rect x="70" y="136" width="480" height="22" rx="8" fill="url(#sheen)" opacity="0.55"/>
  </g>

  <!-- ===== STRIP 3 (front, slight rotation) ===== -->
  <g transform="translate(16, 92) rotate(3 300 160)" filter="url(#softShadow)">
    <rect x="80" y="88" width="480" height="56" rx="11" fill="url(#cookedSurface)" />
    <rect x="88" y="94" width="464" height="44" rx="8" fill="url(#turkeyMeat)" />

    <path d="M 100 106 C 190 102, 300 110, 410 106 C 470 104, 520 108, 534 106"
      fill="none" stroke="url(#fatStreak)" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M 100 122 C 190 118, 300 126, 410 122 C 470 120, 520 124, 534 122"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

    <ellipse cx="220" cy="110" rx="38" ry="10" fill="url(#brownBlotch)" />
    <ellipse cx="420" cy="120" rx="36" ry="10" fill="url(#brownBlotch)" />

    <rect x="90" y="96" width="460" height="20" rx="7" fill="url(#sheen)" opacity="0.5"/>
  </g>

  <!-- scattered light seasoning -->
  <g fill="#6a4a2a" opacity="0.35">
    <circle cx="160" cy="246" r="1.2"/>
    <circle cx="340" cy="256" r="1.1"/>
    <circle cx="470" cy="244" r="1.2"/>
    <circle cx="250" cy="268" r="1.0"/>
  </g>
</svg>