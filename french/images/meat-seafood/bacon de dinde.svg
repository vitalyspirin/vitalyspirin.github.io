<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Pale, lean turkey meat -->
    <linearGradient id="turkeyMeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d2c4" />
      <stop offset="45%" stop-color="#eebbaa" />
      <stop offset="100%" stop-color="#e2a493" />
    </linearGradient>

    <!-- Gentle golden cooked surface -->
    <linearGradient id="cookedSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d99a5c" />
      <stop offset="55%" stop-color="#c98544" />
      <stop offset="100%" stop-color="#b06e33" />
    </linearGradient>

    <!-- Thin, even fat streaks -->
    <linearGradient id="fatStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4ec" />
      <stop offset="50%" stop-color="#f8e6d8" />
      <stop offset="100%" stop-color="#fdf4ec" />
    </linearGradient>

    <!-- Soft sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Browning blotch gradient -->
    <radialGradient id="brownBlotch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b87a3e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#b87a3e" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5a3a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- WHITE background -->
  <rect width="600" height="400" fill="#ffffff" />

  <!-- ===== STRIP 1 (back) — both ends visible ===== -->
  <g opacity="0.93" filter="url(#softShadow)">
    <rect x="26" y="150" width="548" height="110" rx="18" fill="url(#cookedSurface)" />
    <rect x="36" y="160" width="528" height="90" rx="14" fill="url(#turkeyMeat)" />
    <path d="M 52 178 C 190 174, 330 182, 460 178 C 520 176, 556 180, 556 178"
      fill="none" stroke="url(#fatStreak)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 52 206 C 190 202, 330 210, 460 206 C 520 204, 556 208, 556 206"
      fill="none" stroke="url(#fatStreak)" stroke-width="3.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 52 230 C 190 227, 330 233, 460 230 C 520 228, 556 231, 556 230"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
    <ellipse cx="200" cy="186" rx="58" ry="18" fill="url(#brownBlotch)" />
    <ellipse cx="420" cy="218" rx="66" ry="19" fill="url(#brownBlotch)" />
  </g>

  <!-- ===== STRIP 2 (center) — both ends visible ===== -->
  <g filter="url(#softShadow)">
    <rect x="22" y="80" width="556" height="120" rx="20" fill="url(#cookedSurface)" />
    <rect x="32" y="90" width="536" height="100" rx="15" fill="url(#turkeyMeat)" />

    <path d="M 50 110 C 190 106, 330 114, 460 110 C 518 108, 552 112, 552 110"
      fill="none" stroke="url(#fatStreak)" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 50 142 C 190 138, 330 146, 460 142 C 518 140, 552 144, 552 142"
      fill="none" stroke="url(#fatStreak)" stroke-width="3.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M 50 170 C 190 167, 330 173, 460 170 C 518 168, 552 171, 552 170"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>

    <ellipse cx="140" cy="114" rx="70" ry="20" fill="url(#brownBlotch)" />
    <ellipse cx="300" cy="142" rx="80" ry="22" fill="url(#brownBlotch)" />
    <ellipse cx="460" cy="120" rx="68" ry="20" fill="url(#brownBlotch)" />
    <ellipse cx="510" cy="164" rx="46" ry="15" fill="url(#brownBlotch)" />

    <rect x="38" y="94" width="524" height="34" rx="12" fill="url(#sheen)" opacity="0.55"/>
  </g>

  <!-- ===== STRIP 3 (front, slight rotation) — both ends visible ===== -->
  <g transform="rotate(2 300 160)" filter="url(#softShadow)">
    <rect x="26" y="22" width="548" height="110" rx="18" fill="url(#cookedSurface)" />
    <rect x="36" y="32" width="528" height="90" rx="14" fill="url(#turkeyMeat)" />

    <path d="M 54 50 C 190 46, 330 54, 460 50 C 516 48, 554 52, 554 50"
      fill="none" stroke="url(#fatStreak)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 54 82 C 190 78, 330 86, 460 82 C 516 80, 554 84, 554 82"
      fill="none" stroke="url(#fatStreak)" stroke-width="3.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 54 106 C 190 103, 330 109, 460 106 C 516 104, 554 107, 554 106"
      fill="none" stroke="url(#fatStreak)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>

    <ellipse cx="220" cy="58" rx="60" ry="18" fill="url(#brownBlotch)" />
    <ellipse cx="450" cy="92" rx="58" ry="18" fill="url(#brownBlotch)" />

    <rect x="40" y="36" width="520" height="32" rx="11" fill="url(#sheen)" opacity="0.5"/>
  </g>

  <!-- scattered light seasoning -->
  <g fill="#6a4a2a" opacity="0.35">
    <circle cx="120" cy="340" r="1.7"/>
    <circle cx="330" cy="356" r="1.6"/>
    <circle cx="510" cy="338" r="1.7"/>
    <circle cx="220" cy="372" r="1.5"/>
    <circle cx="430" cy="378" r="1.5"/>
  </g>
</svg>