    <use href="#roundPepperoni" transform="translate(284, 430)" />
    <use href="#roundPepperoni" transform="translate(324, 426)" />
    <use href="#roundPepperoni" transform="translate(230, 474)" />
    <use href="#roundPepperoni" transform="translate(274, 474)" />
    <use href="#roundPepperoni" transform="translate(320, 474)" />
