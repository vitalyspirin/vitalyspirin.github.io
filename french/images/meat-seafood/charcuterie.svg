  <g filter="url(#roundItemShadow)">
    <!-- Bottom Cheese Slice -->
    <path d="M 284 44 L 512 92 L 464 296 L 238 220 Z" fill="#E8B743" stroke="#C9982C" stroke-width="1.6" />
    <!-- Middle Cheese Slice -->
    <path d="M 278 28 L 500 74 L 452 282 L 232 218 Z" fill="#F5CB58" stroke="#D4A335" stroke-width="1.6" />
