    <path d="M 242 492 C 274 508, 300 544, 294 588 C 288 626, 256 656, 220 650 C 188 644, 178 602, 194 564 C 208 528, 224 510, 242 492 Z" fill="url(#roundSalmonGrad)" stroke="#C45839" stroke-width="1.8" />
    <path d="M 98 534 C 134 530, 170 552, 184 588 C 198 624, 180 668, 148 682 C 116 696, 80 670, 74 632 C 68 594, 80 558, 98 534 Z" fill="#F28B6B" stroke="#C45839" stroke-width="1.8" />
    <path d="M 254 528 C 292 524, 328 548, 332 590 C 336 632, 308 676, 270 682 C 234 688, 212 650, 222 608 C 230 570, 238 546, 254 528 Z" fill="url(#roundSalmonGrad)" stroke="#C45839" stroke-width="1.8" />
