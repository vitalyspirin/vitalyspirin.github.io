    <circle cx="422" cy="396" r="128" fill="#EAEAEA" fill-opacity="0.72" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="422" cy="396" r="118" fill="#D4CFC9" fill-opacity="0.45" stroke="#B5AFA8" stroke-width="2" />

