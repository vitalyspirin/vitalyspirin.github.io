      <path d="M 178 494 C 204 510, 220 536, 216 566" />
      <path d="M 104 572 C 134 576, 158 596, 164 626" />
      <path d="M 256 564 C 286 568, 308 592, 308 624" />
      <path d="M 224 648 C 250 648, 272 666, 278 692" />
