    <path d="M 286 286 C 306 290, 324 302, 336 320 C 316 314, 294 314, 276 322 Z" fill="#FCEAE8" />

    <g fill="#F9CECC" opacity="0.65">
      <ellipse cx="148" cy="298" rx="9" ry="4.5" transform="rotate(-25 148 298)" />
      <ellipse cx="216" cy="352" rx="12" ry="5" transform="rotate(20 216 352)" />
      <ellipse cx="282" cy="358" rx="10" ry="4.5" transform="rotate(-15 282 358)" />
      <ellipse cx="204" cy="412" rx="9" ry="4.5" />
    </g>
  </g>

  <!-- ================= 5. RIGHT SIDE: ROLLED PANCETTA SLICES ================= -->
  <g filter="url(#roundItemShadow)">
    <use href="#roundPancetta" transform="translate(636, 314) rotate(22)" />
    <use href="#roundPancetta" transform="translate(692, 412) rotate(55)" />
