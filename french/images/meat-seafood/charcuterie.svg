<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Round Wooden Board Gradients -->
    <radialGradient id="roundWoodOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A476" />
      <stop offset="78%" stop-color="#BF8C5E" />
      <stop offset="100%" stop-color="#9C6B42" />
    </radialGradient>
    <radialGradient id="roundWoodInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C89668" />
      <stop offset="75%" stop-color="#B68356" />
      <stop offset="100%" stop-color="#96653C" />
    </radialGradient>

    <!-- Swiss Cheese Gradient -->
    <linearGradient id="swissCheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="100%" stop-color="#F5C44E" />
    </linearGradient>

    <!-- Green Olive Gradient -->
    <radialGradient id="roundOliveGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C6D645" />
      <stop offset="55%" stop-color="#93AB2A" />
      <stop offset="100%" stop-color="#586B14" />
    </radialGradient>

    <!-- Pepperoni Red Gradient -->
    <radialGradient id="roundPepperoniGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C94136" />
      <stop offset="100%" stop-color="#962820" />
    </radialGradient>

    <!-- Smoked Salmon Gradient -->
    <linearGradient id="roundSalmonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F79E7E" />
      <stop offset="100%" stop-color="#E37654" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="roundItemShadow" x="-12%" y="-12%" width="125%" height="125%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#3B1E0B" flood-opacity="0.35" />
    </filter>
    <filter id="roundPlatterShadow" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#291508" flood-opacity="0.22" />
    </filter>

    <!-- Reusable Swirled Pancetta Slice -->
    <g id="roundPancetta">
      <circle cx="0" cy="0" r="82" fill="#FDF2EE" stroke="#B35852" stroke-width="2" />
      <circle cx="0" cy="0" r="75" fill="#E36A68" />
      <path d="M -56 -26 C -30 -64, 36 -64, 56 -24 C 70 8, 52 56, 18 62 C -20 68, -50 38, -42 2 C -32 -26, 8 -36, 30 -12 C 44 6, 32 36, 8 36 C -12 36, -20 14, -6 2" fill="none" stroke="#FBE9E4" stroke-width="13" stroke-linecap="round" />
      <path d="M -26 42 C -42 24, -42 -8, -18 -26 C 6 -42, 42 -30, 48 -4" fill="none" stroke="#C94E4C" stroke-width="5.5" stroke-linecap="round" />
    </g>

    <!-- Reusable Mini Pepperoni Slice -->
    <g id="roundPepperoni">
      <circle cx="0" cy="0" r="34" fill="url(#roundPepperoniGrad)" stroke="#6B1913" stroke-width="1.6" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#E0675E" stroke-width="1.2" opacity="0.5" />
      <g fill="#F09E95" opacity="0.75">
        <circle cx="-12" cy="-11" r="2.5" /><circle cx="10" cy="-14" r="2.8" /><circle cx="18" cy="3" r="2.2" />
        <circle cx="-16" cy="8" r="2.6" /><circle cx="0" cy="2" r="3.2" /><circle cx="8" cy="16" r="2.5" />
        <circle cx="-5" cy="19" r="2" />
      </g>
    </g>

    <!-- Reusable Folded Triangle Ham Slice -->
    <g id="roundTriangleHam">
      <path d="M -78 -24 L 50 -68 C 62 -72, 68 -62, 68 -50 L 68 98 C 68 110, 56 116, 48 108 L -78 -6 C -86 -12, -84 -20, -78 -24 Z" fill="#F29194" stroke="#B8565A" stroke-width="2" />
      <path d="M -54 -14 L 48 -50 L 48 80 Z" fill="none" stroke="#F8B6B8" stroke-width="3" opacity="0.75" />
      <g fill="#FAD0D1" opacity="0.7">
        <circle cx="22" cy="-24" r="3.8" /><circle cx="36" cy="6" r="4.5" /><circle cx="12" cy="22" r="3.2" />
        <circle cx="38" cy="42" r="4" /><circle cx="-12" cy="-6" r="3" />
      </g>
    </g>

    <!-- Reusable Green Olive -->
    <g id="roundOlive">
      <ellipse cx="0" cy="0" rx="34" ry="28" fill="url(#roundOliveGrad)" stroke="#49590F" stroke-width="1.8" />
      <ellipse cx="-10" cy="-9" rx="11" ry="6" transform="rotate(-20 -10 -9)" fill="#E3F07A" opacity="0.55" />
      <ellipse cx="19" cy="3" rx="8.5" ry="11.5" transform="rotate(15 19 3)" fill="#2F3B08" />
      <ellipse cx="17" cy="3" rx="4.5" ry="7.5" transform="rotate(15 17 3)" fill="#4D5E12" />
    </g>
  </defs>

  <!-- ================= 1. ROUND WOODEN CHARCUTERIE PLATTER ================= -->
  <g filter="url(#roundPlatterShadow)">
    <circle cx="400" cy="400" r="392" fill="url(#roundWoodOuter)" stroke="#8A5C36" stroke-width="2.5" />

    <!-- Subtle Concentric Wood Grain Rings -->
    <g fill="none" stroke="#8C5D37" stroke-width="1.5" opacity="0.32">
      <circle cx="400" cy="400" r="380" />
      <circle cx="400" cy="400" r="366" />
      <circle cx="400" cy="400" r="340" />
      <circle cx="400" cy="400" r="260" />
      <circle cx="400" cy="400" r="180" />
    </g>

    <!-- Carved Perimeter Groove -->
    <circle cx="400" cy="400" r="356" fill="url(#roundWoodInner)" stroke="#7A4D29" stroke-width="3.5" />
    <circle cx="400" cy="400" r="351" fill="none" stroke="#DFB68C" stroke-width="1.8" opacity="0.6" />
  </g>

