      <path d="M 678 320 
               C 728 318, 744 272, 722 232 
               C 700 194, 638 188, 582 190 
               L 582 174 
               C 648 170, 718 180, 744 226 
               C 772 274, 750 342, 692 358 Z" fill="#753416" />
      <!-- Tail highlight -->
      <path d="M 592 178 C 652 176, 712 186, 736 226" fill="none" stroke="#9C4E27" stroke-width="3" />

      <!-- Flowing Black Tail Tuft -->
      <path d="M 584 182 
               C 584 162, 560 150, 520 144 
               C 476 138, 424 124, 384 90 
               C 394 114, 412 132, 434 142 
               C 418 140, 404 136, 392 132 
               C 408 152, 432 164, 456 170 
               C 444 172, 436 174, 430 176 
               C 456 188, 488 202, 526 208 
               C 562 212, 584 200, 584 182 Z" fill="url(#tailTuftGrad)" stroke="#141414" />
      <!-- Tail Tuft Hair Streaks -->
      <path d="M 564 176 C 524 172, 484 162, 444 146" fill="none" stroke="#4D4D4D" stroke-width="2.5" />
      <path d="M 568 188 C 534 188, 498 184, 466 174" fill="none" stroke="#454545" stroke-width="2" />
    </g>

    <!-- ================= 2. BACKGROUND LEGS (FAR SIDE) ================= -->
    <!-- Back-Left Leg (Further Hind Leg) -->
    <g>
      <path d="M 484 494 
               C 502 524, 524 552, 524 574 
