               C 118 72, 168 56, 212 78 
               C 254 58, 294 78, 294 118 
               C 294 134, 290 148, 294 164 
               C 298 184, 290 206, 274 218 
               C 254 252, 198 262, 152 248 
               C 112 236, 94 204, 102 170 
