<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" width="820" height="750">
  <defs>
    <!-- Coat Shading & Highlights -->
    <linearGradient id="bullCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A411E" />
      <stop offset="60%" stop-color="#793718" />
      <stop offset="100%" stop-color="#632B11" />
    </linearGradient>

    <linearGradient id="bullHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E4F28" />
      <stop offset="100%" stop-color="#793718" />
    </linearGradient>

    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C8B8B" />
      <stop offset="65%" stop-color="#6B6A6A" />
      <stop offset="100%" stop-color="#4A4949" />
    </linearGradient>

    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F28482" />
      <stop offset="60%" stop-color="#E56B6F" />
      <stop offset="100%" stop-color="#C95256" />
    </linearGradient>

    <linearGradient id="hoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43464B" />
      <stop offset="100%" stop-color="#222426" />
    </linearGradient>

    <linearGradient id="tailTuftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
  </defs>

  <g stroke="#2B1207" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

