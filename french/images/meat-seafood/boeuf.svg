                 C 178 198, 198 196, 218 206 
                 C 232 212, 244 212, 258 204 
                 C 276 192, 294 198, 292 218 
                 C 290 232, 284 240, 282 250 
                 C 278 264, 258 268, 246 258 
                 C 238 268, 206 270, 190 258 
                 C 180 250, 178 232, 178 214 Z" fill="url(#muzzleGrad)" stroke="#4D1E0B" stroke-width="2.4" />

