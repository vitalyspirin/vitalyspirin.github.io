      <!-- Right Eye (Viewer's Right) -->
      <g>
        <ellipse cx="274" cy="142" rx="15" ry="25" transform="rotate(8 274 142)" fill="#FFFFFF" stroke="#2B1207" stroke-width="2.4" />
        <ellipse cx="271" cy="146" rx="9" ry="13.5" transform="rotate(6 271 146)" fill="#6E3B23" stroke="#1F0D05" stroke-width="1.8" />
        <ellipse cx="270" cy="146" rx="5" ry="8" transform="rotate(6 270 146)" fill="#121212" stroke="none" />
        <circle cx="266" cy="139" r="3.2" fill="#FFFFFF" stroke="none" />
        <circle cx="273" cy="151" r="1.4" fill="#FFFFFF" stroke="none" />
        <!-- Angry Eyebrow -->
        <path d="M 294 114 C 280 102, 266 106, 258 120 C 266 112, 280 110, 294 114 Z" fill="#171717" stroke="#171717" stroke-width="1.5" />
      </g>

      <!-- Pink Muzzle & Lower Lip -->
      <g>
        <!-- Lower Lip -->
        <path d="M 186 254 
                 C 188 274, 212 284, 238 282 
                 C 262 280, 276 268, 276 252 
                 C 254 262, 212 262, 186 254 Z" fill="#E56B6F" stroke="#4D1E0B" stroke-width="2.4" />

