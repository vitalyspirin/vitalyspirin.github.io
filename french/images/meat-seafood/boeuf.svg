               C 454 640, 450 648, 456 656 
               L 432 642 
               C 434 628, 456 608, 482 586 
               C 488 580, 486 568, 472 548 
               C 454 522, 432 504, 412 494 Z" fill="#662C12" />
      <!-- Subtle shading -->
      <path d="M 488 582 C 504 574, 514 584, 502 596 C 488 610, 468 624, 456 636" fill="none" stroke="#8C4320" stroke-width="2.2" />
      <!-- Hoof -->
      <path d="M 432 638 
               C 408 644, 384 658, 386 674 
               C 388 688, 424 692, 452 684 
               C 468 680, 472 672, 466 660 
               C 460 648, 446 636, 432 638 Z" fill="url(#hoofGrad)" stroke="#17181A" />
      <path d="M 394 668 C 412 656, 432 652, 448 654" fill="none" stroke="#61656B" stroke-width="2" />
    </g>

    <!-- Front-Right Leg (Raised/Bent Foreleg) -->
