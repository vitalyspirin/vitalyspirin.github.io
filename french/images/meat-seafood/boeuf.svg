      <path d="M 196 86 C 204 82, 214 82, 222 86" fill="none" stroke="#9E4F28" stroke-width="2.5" />
      <path d="M 164 154 C 174 174, 182 192, 184 208" fill="none" stroke="#52210B" stroke-width="2.2" />
      <path d="M 262 154 C 272 172, 278 188, 280 204" fill="none" stroke="#52210B" stroke-width="2.2" />
      <path d="M 122 166 C 132 178, 146 180, 158 174" fill="none" stroke="#52210B" stroke-width="2" />

      <!-- Left Eye (Viewer's Left) -->
      <g>
        <ellipse cx="142" cy="138" rx="16" ry="26" transform="rotate(-10 142 138)" fill="#FFFFFF" stroke="#2B1207" stroke-width="2.4" />
        <ellipse cx="145" cy="142" rx="9.5" ry="14" transform="rotate(-8 145 142)" fill="#6E3B23" stroke="#1F0D05" stroke-width="1.8" />
        <ellipse cx="146" cy="142" rx="5.5" ry="8.5" transform="rotate(-8 146 142)" fill="#121212" stroke="none" />
        <circle cx="141" cy="135" r="3.5" fill="#FFFFFF" stroke="none" />
        <circle cx="148" cy="147" r="1.5" fill="#FFFFFF" stroke="none" />
