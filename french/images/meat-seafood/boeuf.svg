             C 634 692, 646 678, 644 662 
             C 642 642, 634 606, 634 574 
             C 634 542, 636 494, 622 456 
             C 656 456, 704 422, 708 376 
             C 712 332, 676 298, 628 294 
             C 554 288, 496 276, 444 260 
             C 424 234, 384 224, 344 234 
