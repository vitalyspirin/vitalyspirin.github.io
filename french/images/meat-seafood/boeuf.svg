      <path d="M 576 718 C 588 704, 606 698, 622 702" fill="none" stroke="#61656B" stroke-width="2" />
    </g>

    <!-- Front-Left Leg (Extended Forward Foreleg) -->
    <g>
      <path d="M 278 364 
               C 242 402, 224 464, 212 524 
               C 206 548, 198 564, 184 582 
               C 166 606, 146 644, 134 682 
               L 162 698 
               C 182 666, 206 626, 224 600 
               C 234 586, 246 576, 250 562 
