        <path d="M 256 210 C 268 202, 280 202, 284 210" fill="none" stroke="#F7A8A6" stroke-width="3" />

        <!-- Left Nostril -->
        <path d="M 204 226 
                 C 210 220, 224 226, 226 238 
                 C 228 248, 218 252, 210 246 
                 C 202 240, 198 232, 204 226 Z" fill="#4D1412" stroke="#2B0908" stroke-width="2" />
        <ellipse cx="212" cy="233" rx="3" ry="2" fill="#8C322E" stroke="none" />

        <!-- Right Nostril -->
        <path d="M 272 224 
                 C 266 218, 254 224, 254 236 
                 C 254 246, 262 248, 270 242 
                 C 276 236, 278 230, 272 224 Z" fill="#4D1412" stroke="#2B0908" stroke-width="2" />
        <ellipse cx="266" cy="231" rx="2.8" ry="1.8" fill="#8C322E" stroke="none" />

        <!-- Philtrum & Mouth Dimple -->
