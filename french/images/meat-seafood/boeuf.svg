      <path d="M 156 364 
               C 122 384, 92 406, 76 426 
               C 68 436, 72 450, 84 464 
               C 108 492, 138 524, 156 544 
               C 172 562, 198 564, 212 550 
               C 224 538, 224 514, 212 502 
