      <!-- Forearm & Knee Shading -->
      <path d="M 274 374 C 242 414, 226 472, 216 528" fill="none" stroke="#9E4F28" stroke-width="3" />
      <path d="M 222 522 C 234 532, 244 546, 248 562" fill="none" stroke="#52210B" stroke-width="2.4" />
      <path d="M 250 524 C 266 512, 282 496, 294 476" fill="none" stroke="#52210B" stroke-width="2.2" />

