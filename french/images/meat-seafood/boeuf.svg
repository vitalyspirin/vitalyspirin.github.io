    <!-- Shoulder Hump & Neck Highlight Ridges -->
    <path d="M 344 234 C 378 232, 412 242, 434 266" fill="none" stroke="#9E4F28" stroke-width="3.5" />
    <path d="M 434 266 C 440 274, 446 284, 450 296" fill="none" stroke="#2B1207" stroke-width="2.4" />
    <path d="M 428 268 C 434 276, 440 286, 444 298" fill="none" stroke="#9E4F28" stroke-width="2.4" />

    <path d="M 314 204 C 334 224, 348 250, 356 278" fill="none" stroke="#2B1207" stroke-width="2.4" />
    <path d="M 308 206 C 328 226, 342 252, 350 280" fill="none" stroke="#9E4F28" stroke-width="2.4" />

    <!-- Hindquarter Thigh Muscle Crease & Highlight -->
    <path d="M 526 364 C 544 416, 568 462, 608 492" fill="none" stroke="#2B1207" stroke-width="2.4" />
    <path d="M 532 362 C 550 414, 574 460, 614 490" fill="none" stroke="#9E4F28" stroke-width="2.8" />
    <path d="M 594 584 C 608 574, 622 574, 634 580" fill="none" stroke="#52210B" stroke-width="2.2" />

