<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    
    <radialGradient id="tomatoBody" cx="38%" cy="32%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="25%" stop-color="#e83817" />
      <stop offset="65%" stop-color="#c92208" />
      <stop offset="92%" stop-color="#961504" />
      <stop offset="100%" stop-color="#7a1103" />
    </radialGradient>

    
    <radialGradient id="topHighlight" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ff997a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e83817" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="rightHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ff8566" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e83817" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="95%" stop-color="#ff9e85" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffccb8" stop-opacity="0.35" />
    </linearGradient>

    
    <radialGradient id="stemCrevice" cx="46%" cy="36%" r="22%">
      <stop offset="0%" stop-color="#4d0900" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#801100" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c92208" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b9433" />
      <stop offset="45%" stop-color="#4c731f" />
      <stop offset="100%" stop-color="#2a470c" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ca63f" />
      <stop offset="50%" stop-color="#496e1d" />
      <stop offset="100%" stop-color="#26400a" />
    </linearGradient>

    
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#658c30" />
      <stop offset="50%" stop-color="#436319" />
      <stop offset="100%" stop-color="#1e3306" />
    </linearGradient>

    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#4a0700" flood-opacity="0.55" />
    </filter>

    
    <filter id="calyxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#3d0500" flood-opacity="0.6" />
    </filter>

    
    <g id="droplet">
      <ellipse cx="0" cy="0" rx="5" ry="3.5" fill="#991402" fill-opacity="0.35" filter="url(#dropShadow)" />
      <ellipse cx="0" cy="-0.4" rx="4.5" ry="3" fill="#ff7352" fill-opacity="0.35" />
      <ellipse cx="-1.5" cy="-1.2" rx="1.6" ry="0.9" fill="#ffffff" fill-opacity="0.85" transform="rotate(-15 -1.5 -1.2)" />
      <path d="M -3.5 1 Q 0 3 3.5 1" fill="none" stroke="#ffb39e" stroke-width="0.7" stroke-opacity="0.75" />
    </g>

    <g id="dropletSmall">
      <circle cx="0" cy="0" r="2.2" fill="#8c1100" fill-opacity="0.35" />
      <circle cx="-0.7" cy="-0.7" r="0.8" fill="#ffffff" fill-opacity="0.85" />
      <path d="M -1.5 0.8 Q 0 1.8 1.5 0.8" fill="none" stroke="#ffad96" stroke-width="0.5" stroke-opacity="0.7" />
    </g>
