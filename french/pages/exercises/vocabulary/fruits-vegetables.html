<html lang="fr">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Fruits et légumes</title>

    <link rel="icon" type="image/x-icon" href="../../../images/eiffel-tower.ico" />
    <link rel="stylesheet" href="../../../styles.css" />

    <script type="module">
        "use strict";
        import wordList, { imageFileFolder, audioFileFolder } from '../../../js/vocabulary/fruitsVegetables.mjs';
        import PageBuilderForWordListWithImages from '../../../js/PageBuilderForWordListWithImages.mjs';
        PageBuilderForWordListWithImages.build(
            wordList,
            'fruits',
            imageFileFolder,
            audioFileFolder
        );

        PageBuilderForWordListWithImages.build(
            wordList,
            'vegetables',
            imageFileFolder,
            audioFileFolder
        );

        import { ErrorCounter } from '../../../js/ErrorCounter.mjs';
        ErrorCounter.initialize();
    </script>
</head>

<body id="fruits-vegetables-page">
    <main spellcheck="false">
        <article class="text">
            <h1>Fruits et légumes</h1>
            <h2>Exercices et corrigé</h2>

            <template id="template-li-for-one-word">
                <li>
                    <img />
                    <input type="text" class="wide" pattern="" />
                </li>

                <button class="speakerphone" tabindex="-1">
                    <audio></audio>
                    <svg width="20" height="20" viewBox="0 0 24 24" focusable="false" class=" NMm5M">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm7-.17v6.34L7.83 13H5v-2h2.83L10 8.83zM16.5 12A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z">
                        </path>
                        <path
                            d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z">
                        </path>
                    </svg>
                </button>

                </li>
            </template>

            <ol class="nested">
                <li>
                    <section>
                        <h3>Identifiez ces fruits.</h3>

                        <ol class="fruits"></ol>
                    </section>
                </li>

                <li>
                    <section>
                        <h3>Identifiez ces légumes.</h3>

                        <ol class="vegetables"></ol>
                    </section>
                </li>
            </ol>

            <iframe id="error-counter" src="../../partials/error-counter.html"
                onload="this.before(...(this.contentWindow.document.body||this.contentWindow.document).children);this.remove()"></iframe>

        </article>
    </main>
