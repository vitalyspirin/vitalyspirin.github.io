<!DOCTYPE html>

<!-- exercises are taken from https://oraprdnt.uqtr.uquebec.ca/portail/docs/GSC2213/F603134851_le_genre_des_noms_communs_tableau_et_exercices.pdf -->

<html lang="fr">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Le genre des noms communs</title>

    <link rel="icon" type="image/x-icon" href="../../../images/eiffel-tower.ico" />
    <link rel="stylesheet" href="../../../styles.css" />

    <script type="module">
        "use strict";

        import wordList, { audioFileFolder } from '../../../js/vocabulary/masculineFeminine.mjs';
        import PageBuilderForWordList from '../../../js/PageBuilderForWordList.mjs';

        PageBuilderForWordList.build(wordList, audioFileFolder);

        import Exercise from '../../../js/Exercise.mjs';
        Exercise.init().useOneTimerOnly();
    </script>
</head>

<body>
    <main spellcheck="false">
        <article class="text">
            <h1>Masculin ou féminin ?</h1>
            <h2>Exercices et corrigé</h2>

            <section class="radio-buttons">
                <h3>Choisissez <i>un</i> ou <i>une</i> devant les mots suivants.</h3>

                <ol id="word-list">
                    <template id="template-li-for-one-word">
                        <li class="CEFR">
                            <span>
                                <label>
                                    <input type="radio" data-type="two-choices" name="" value="un" />un
                                </label>

                                <label>
                                    <input type="radio" data-type="two-choices" name="" value="une" />une
                                </label>
                            </span>
                            <span title="article">word</span>

                            <button class="speakerphone" tabindex="-1">
                                <audio></audio>
                            </button>

                        </li>
                    </template>

                </ol>
            </section>

            <iframe id="error-counter" src="../../partials/error-counter.html"
                onload="this.before(...(this.contentWindow.document.body||this.contentWindow.document).children);this.remove()"></iframe>

        </article>
    </main>
</body>

</html>
