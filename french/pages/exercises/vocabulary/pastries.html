<html lang="fr">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Le pain, les pâtisseries et les sucreries</title>

    <link rel="icon" type="image/x-icon" href="../../../images/eiffel-tower.ico" />
    <link rel="stylesheet" href="../../../styles.css" />

    <script type="module">
        "use strict";
        import wordList, { imageFileFolder, audioFileFolder } from '../../../js/vocabulary/pastries.mjs';
        import PageBuilderForWordListWithImages from '../../../js/PageBuilderForWordListWithImages.mjs';
        PageBuilderForWordListWithImages.build(
            wordList,
            'pastry',
            imageFileFolder,
            audioFileFolder
        );

        import Exercise from '../../../js/Exercise.mjs';
        Exercise.init();
    </script>
</head>

<body>
    <main spellcheck="false">
        <article class="text list-with-images">
            <h1>Le pain, les pâtisseries et les sucreries</h1>
            <h2>Exercices et corrigé</h2>

            <ol class="nested">
                <li>
                    <section>
                        <h3>Identifiez ces aliments.</h3>

                        <ol class="pastry"></ol>
                    </section>
                </li>
            </ol>

            <template id="template-li-for-one-word">
                <li>
                    <div class="li-box">
                        <span class="article"></span>

                        <span class="word"></span>

                        <span class="image-box">
                            <img />
                        </span>

                        <input type="text" class="wide" pattern="" />

                        <button class="speakerphone" tabindex="-1">
                            <audio></audio>
                        </button>
                    </div>
                </li>
            </template>


            <iframe id="error-counter" src="../../partials/error-counter.html"
                onload="this.before(...(this.contentWindow.document.body||this.contentWindow.document).children);this.remove()"></iframe>

        </article>
    </main>
</body>

</html>
