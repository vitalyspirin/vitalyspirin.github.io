<!DOCTYPE html>

<html lang="fr">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>H muet ou aspiré</title>

    <link rel="icon" type="image/x-icon" href="../../../images/eiffel-tower.ico" />
    <link rel="stylesheet" href="../../../styles.css" />

    <script type="module">
        "use strict";

        import hMuet, { audioFileFolder } from '../../../js/vocabulary/hMuet.mjs';
        import PageBuilderForWordList from '../../../js/PageBuilderForWordList.mjs';

        PageBuilderForWordList.build(hMuet, audioFileFolder);

        import Exercise from '../../../js/Exercise.mjs';
        Exercise.init().useOneTimerOnly();
    </script>
</head>

<body>
    <main spellcheck="false">
        <article class="text">
            <h1>H muet ou aspiré ?</h1>
            <h2>Exercices et corrigé</h2>

            <section class="radio-buttons">
                <h3>Choisissez <i>le</i>, <i>la</i> ou <i>l’</i> devant les mots suivants.</h3>

                <ol id="word-list">
                    <template id="template-li-for-one-word">
                        <li class="CEFR">
                            <span>
                                <label>
                                    <input type="radio" data-type="three-choices" name="" value="le" />le
                                </label>

                                <label>
                                    <input type="radio" data-type="three-choices" name="" value="la" />la
                                </label>

                                <label>
                                    <input type="radio" data-type="three-choices" name="" value="l'" />l'
                                </label>
                            </span>
                            <span title="article">word</span>

                            <button class="speakerphone" tabindex="-1">
                                <audio></audio>
                            </button>

                        </li>
                    </template>

                </ol>
            </section>

            <iframe id="error-counter" src="../../partials/error-counter.html"
                onload="this.before(...(this.contentWindow.document.body||this.contentWindow.document).children);this.remove()"></iframe>

        </article>
    </main>
</body>

</html>
